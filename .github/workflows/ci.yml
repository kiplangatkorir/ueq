name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      # E722: bare `except:`. T201: `print()`. Neither is allowed in library code.
      - name: Run ruff
        run: ruff check ueq --select E722,T201

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      # torch is still a hard dependency of ueq. Install the CPU-only build
      # first so that `pip install -e .` does not pull the much larger CUDA build.
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install ueq and pytest
        run: pip install -e . pytest
      - name: Run tests
        run: pytest -q

  examples:
    name: Examples smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install ueq
        run: pip install -e .
      - name: Run every example
        run: python .github/scripts/run_examples.py
